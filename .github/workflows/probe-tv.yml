name: probe-tv
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node scripts/probe-turnout.mjs
          PROBE=1 OUT=/tmp/tv.json node scripts/fetch-tv.mjs
