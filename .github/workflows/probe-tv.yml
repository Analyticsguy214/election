name: probe-tv
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node -e '
          const UA={"user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36","accept-language":"en-US,en;q=0.9",cookie:"CONSENT=YES+1; SOCS=CAI"};
          (async()=>{for(const id of ["UCBi2mrWuNuyYy4gbM6fU18Q","UC6ZFN9Tx6xh-skXCuRHCDpQ"]){const r=await fetch("https://www.youtube.com/channel/"+id+"/live",{headers:UA});const h=await r.text();
          console.log("P",id,r.status,r.url,h.length,"isLiveNow:"+/"isLiveNow":true/.test(h),"isLive:"+/"isLive":true/.test(h),"upc:"+/"isUpcoming":true/.test(h),"canon:"+((h.match(/rel="canonical" href="([^"]+)"/)||[])[1]),"title:"+((h.match(/<title>([^<]*)/)||[])[1]),"bot:"+/not a bot|unusual traffic|consent\.youtube/i.test(h))}
          const o=await fetch("https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=wF8X-K_l5kY&format=json");console.log("P oembed",o.status)})()'
