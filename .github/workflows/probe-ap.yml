name: probe-ap
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node -e '
          globalThis.window=globalThis;require("./assets/apdirect.js");
          const races=require("./data/races.json");const prev=require("./data/national-live.json");
          window.HEDap(races,prev).then(o=>{const ids=Object.keys(o.races);console.log("AP",ids.length,"races",JSON.stringify(o.house),Object.keys(o.senateCalledStates).length,"senate called");
          for(const id of ids){const r=o.races[id];const t=r.v.reduce((a,b)=>a+b,0);if(t>0||r.called!=null)console.log("AP",id,JSON.stringify(r.v),r.r,r.called)}})'
