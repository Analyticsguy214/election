name: probe-ap
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cp data/national-live.json /tmp/prev.json
          time timeout 50 node scripts/fetch-national.mjs; echo "rc=$?"
          node -e 'const a=require("/tmp/prev.json"),b=require("./data/national-live.json");for(const k in b.races){const x=b.races[k],y=a.races[k];if(x.total>0)console.log("NAT",k,JSON.stringify(x.v),x.r,"prev",y&&JSON.stringify(y.v))}'
          time timeout 50 node scripts/fetch-tx-sos.mjs; echo "rc=$?"
