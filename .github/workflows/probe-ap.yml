name: probe-ap
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node -e '
          globalThis.window=globalThis;require("./assets/apdirect.js");
          window.HEDap(require("./data/races.json"),require("./data/national-live.json")).then(o=>{console.log("AP all",o.all.length);for(const x of o.all.slice(0,15))console.log("AP",x.label,x.tot,x.r,JSON.stringify(x.cs.map(c=>[c.ln,c.p,c.v])),JSON.stringify(x.won))})'
