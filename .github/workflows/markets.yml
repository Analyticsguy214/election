name: Update prediction markets
# One run loops for ~5h40m, refreshing Kalshi + Polymarket every 2 minutes,
# then starts the next run itself. The schedule below is only a backup starter.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: markets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh markets every 2 minutes
        run: |
          git config user.name "hilltop-bot"
          git config user.email "hilltop-bot@users.noreply.github.com"
          END=$((SECONDS+20400))
          while [ $SECONDS -lt $END ]; do
            git pull -q --rebase --autostash || true
            node scripts/fetch-markets.mjs || echo "fetch failed"
            git add data/markets.json
            if ! git diff --cached --quiet; then
              git commit -qm "Update market odds"
              (git push -q || (git pull -q --rebase && git push -q)) && gh workflow run deploy.yml --ref main || echo "push/deploy failed"
            fi
            sleep 120
          done
      - name: Start the next run
        if: always()
        run: gh workflow run markets.yml --ref main
