name: Update prediction markets
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-markets.mjs
      - name: Commit if changed
        run: |
          git config user.name "hilltop-bot"
          git config user.email "hilltop-bot@users.noreply.github.com"
          git add data/markets.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market odds"
          git pull --rebase --autostash
          git push
