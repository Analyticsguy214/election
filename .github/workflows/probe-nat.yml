name: Probe Civix ENR
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat > /tmp/p.mjs <<'JS'
          const B="https://goelect.txelections.civixapps.com";const D=B+"/ivis-enr-ui/assets/data";const UA={"user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130","accept":"application/json,*/*"};
          const T=async(u,n=500)=>{try{const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{headers:UA});const t=await r.text();console.log("GET",r.status,(r.headers.get("content-type")||"").slice(0,30),t.length,u.replace(B,""),"::",t.slice(0,n).replace(/\s+/g," "));try{return JSON.parse(t)}catch(e){return null}}catch(e){console.log("ERR",u,e.message);return null}};
          const home=await (await fetch(B+"/ivis-enr-ui/races",{headers:UA})).text();const main=home.match(/main\.[a-f0-9]+\.js/)[0];const js=await (await fetch(B+"/ivis-enr-ui/"+main,{headers:UA})).text();
          for(const k of ["assets/data","Version.json","ElectionConstants","County.json","StateWide","Home.json","electionUrl","api-ivis-system"]){let i=js.indexOf(k),n=0;while(i>=0&&n<3){console.log("CTX",k,"::",js.slice(Math.max(0,i-220),i+260).replace(/\s+/g," "));i=js.indexOf(k,i+k.length);n++}}
          const v=await T(D+"/Version.json");
          if(v&&v.___versionNo!=null){const ec=await T(D+"/ElectionConstants_"+v.___versionNo+".json",1500);
            if(ec){console.log("CURRENT",JSON.stringify(ec.currentelectionInfo));const y=ec.electionInfo&&ec.electionInfo["2026"];console.log("Y2026",JSON.stringify(y).slice(0,1500));
              let id=ec.currentelectionInfo&&ec.currentelectionInfo.ID;if(y)for(const t of Object.keys(y))for(const [k,e] of Object.entries(y[t]))if(/NOVEMBER/i.test(e.N||"")&&(e.ET==="G"||t==="G"))id=e.ID||k;
              console.log("PICK",id);for(const base of [D+"/election/"+id,D+"/"+id]){const ev=await T(base+"/Version.json");if(ev&&ev.___versionNo!=null){for(const f of ["Home.json","Race.json","StateWide.json","Federal.json","County.json"])await T(base+"/"+ev.___versionNo+"/"+f,700);break}}}}
          JS
          node /tmp/p.mjs
