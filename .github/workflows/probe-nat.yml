name: Test national feed
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          DATE=2024-11-05 OUT=data/national-test.json node scripts/fetch-national.mjs
          git config user.name "hilltop-bot"; git config user.email "hilltop-bot@users.noreply.github.com"
          git add data/national-test.json && git commit -qm "Test national feed" && (git push -q || (git pull -q --rebase && git push -q))
