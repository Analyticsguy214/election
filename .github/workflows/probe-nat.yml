name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          for id in 53813 58314; do ELECTION_ID=$id SOS=civix OUT=/tmp/t$id.json node scripts/fetch-tx-sos.mjs; node -e "const o=require('/tmp/t$id.json');console.log('SUM',o.system,o.electionId,o.sosUpdated,JSON.stringify(o.countiesReporting),JSON.stringify(o.polling));for(const[k,v] of Object.entries(o.races))console.log('R',k,v.sosName,JSON.stringify(v.statewide),Object.keys(v.counties).length,'cty',JSON.stringify(v.counties['48113']||null),v.final)"; done
          OUT=/tmp/live.json node scripts/fetch-tx-sos.mjs; node -e "const o=require('/tmp/live.json');console.log('LIVE',o.system,o.electionId,o.electionName,o.sosUpdated,Object.keys(o.races).join(','))"
