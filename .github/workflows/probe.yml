name: Probe VoteHub
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe && cd probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -sSL -A "$UA" -D headers.txt "https://votehub.com/2026-early-vote-tracker?state=texas" -o page.html || true
          wc -c page.html > summary.txt
          grep -oE '(src|href)="[^"]+\.js[^"]*"' page.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u > scripts.txt || true
          grep -oE 'https?://[^"'"'"' <>]*(api|json|data|early|vote)[^"'"'"' <>]*' page.html | sort -u > urls_in_html.txt || true
          : > urls_in_js.txt
          while read -r s; do
            case "$s" in http*) u="$s";; //*) u="https:$s";; /*) u="https://votehub.com$s";; *) u="https://votehub.com/$s";; esac
            curl -sSL -A "$UA" "$u" -o tmp.js || continue
            echo "== $u ($(wc -c < tmp.js) bytes)" >> urls_in_js.txt
            grep -oE '"(https?:)?//[^"]*"|"/[a-zA-Z0-9_./-]*(api|json|early|vote|tracker)[a-zA-Z0-9_./?=&-]*"' tmp.js | sort -u | head -80 >> urls_in_js.txt
          done < scripts.txt
          grep -oE 'early[-_]?vote[^"<]{0,200}' page.html | head -40 > early_snippets.txt || true
          head -c 20000 page.html > page_head.html
          rm -f page.html tmp.js
      - run: |
          git config user.name "hilltop-bot"; git config user.email "hilltop-bot@users.noreply.github.com"
          git add probe; git commit -qm "Probe VoteHub data source" && (git push -q || (git pull -q --rebase && git push -q))
