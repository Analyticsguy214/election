name: Probe Texas SOS
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p probe
          cat > /tmp/p.mjs <<'JS'
          import fs from "node:fs";
          const B="https://results.texas-election.com";const UA={"user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"};
          const out=[];const log=(...a)=>{out.push(a.join(" "));console.log(...a)};
          const home=await (await fetch(B+"/",{headers:UA})).text();
          const main=home.match(/main\.[a-f0-9]+\.js/)[0];const js=await (await fetch(B+"/"+main,{headers:UA})).text();
          for(const k of ["appJsonPath","getElectionVersionUrl","ElectionConstants_","electionVerisonUrl","Version.json","StateWide.json","County.json","Race.json","Lookups.json","Home.json","Texas_Map.json","environment"]){
            let i=0,n=0;while((i=js.indexOf(k,i))>=0&&n<5){log("##",k,"::",js.slice(Math.max(0,i-260),i+260).replace(/\s+/g," "));i+=k.length;n++}
          }
          const m=js.match(/appJsonPath:"([^"]*)"/);log("appJsonPath=",m&&m[1]);
          const tryU=async u=>{try{const r=await fetch(u,{headers:UA});const t=await r.text();log("GET",u,r.status,r.headers.get("content-type"),t.length,t.slice(0,600).replace(/\s+/g," "))}catch(e){log("ERR",u,e.message)}};
          if(m){const p=m[1];const base=p.startsWith("http")?p:B+(p.startsWith("/")?"":"/")+p;for(const f of ["","ElectionConstants_1.json","Elections.json","ElectionConstants.json"])await tryU(base+f)}
          fs.writeFileSync("probe/out.txt",out.join("\n"));
          JS
          node /tmp/p.mjs
      - run: |
          git config user.name "hilltop-bot"; git config user.email "hilltop-bot@users.noreply.github.com"
          git add probe; git commit -qm "Probe Texas SOS results site" && (git push -q || (git pull -q --rebase && git push -q))
