name: Probe Texas SOS
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe && cd probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          B=https://results.texas-election.com
          M=$(curl -sSL -A "$UA" "$B/" | grep -oE 'main\.[a-f0-9]+\.js' | head -1)
          curl -sSL -A "$UA" "$B/$M" -o main.js
          for k in appJsonPath getElectionVersionUrl ElectionConstants_ electionVerisonUrl Version.json StateWide.json County.json Race.json Lookups.json Home.json environment; do
            echo "##### $k" >> ctx.txt; grep -oE ".{0,300}$k.{0,300}" main.js | head -6 >> ctx.txt; done
          grep -oE 'appJsonPath:"[^"]*"|apiPath:"[^"]*"|[a-zA-Z]+Path:"[^"]*"|[a-zA-Z]+Url:"[^"]*"' main.js | sort -u > paths.txt
          cat paths.txt
          rm -f main.js
      - run: |
          git config user.name "hilltop-bot"; git config user.email "hilltop-bot@users.noreply.github.com"
          git add probe; git commit -qm "Probe Texas SOS results site" && (git push -q || (git pull -q --rebase && git push -q))
